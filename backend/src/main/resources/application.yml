spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/folio}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
  servlet:
    multipart:
      max-file-size: 150MB
      max-request-size: 150MB

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never

folio:
  jwt:
    secret: ${JWT_SECRET:folio-super-secret-key-change-in-production-at-least-256-bits-long}
    expiration-ms: 86400000   # 24 hours
  storage:
    type: local
    local-path: ${STORAGE_PATH:./uploads}

logging:
  level:
    com.folio: INFO
    org.springframework.security: WARN
