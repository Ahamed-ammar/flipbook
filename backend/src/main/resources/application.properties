# ── Server ──────────────────────────────────────────
server.port=8080

# ── Database ─────────────────────────────────────────
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/folio_db}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ───────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ── File Upload ───────────────────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=150MB
spring.servlet.multipart.max-request-size=150MB

# ── Storage ───────────────────────────────────────────
folio.storage.type=local
folio.storage.local.path=${STORAGE_PATH:./uploads}

# ── JWT ───────────────────────────────────────────────
folio.jwt.secret=${JWT_SECRET:folioSecretKey2025ChangeThisInProduction!32chars+}
folio.jwt.expiration=86400000

# ── CORS ─────────────────────────────────────────────
folio.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

# ── Logging ──────────────────────────────────────────
logging.level.com.folio=INFO
logging.level.org.springframework.security=WARN
